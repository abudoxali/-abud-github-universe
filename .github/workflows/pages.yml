name: Deploy GitHub Universe to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test & publish static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public repository membership
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-public.mjs
      - name: Persist verified public-only inventory
        run: |
          if ! git diff --quiet -- data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js
            git commit -m "chore(data): reconcile public GitHub repos"
            git push origin HEAD:main
          fi
      - name: Verify static assets and JavaScript syntax
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s command-center.js
          test -s command-center.css
          test -s intelligence.js
          test -s intelligence.css
          test -s decisions.js
          test -s decisions.css
          test -s data.js
          test -s favicon.svg
          node --check app.js
          node --check command-center.js
          node --check intelligence.js
          node --check decisions.js
          node --check data.js
          node --check tests/smoke.mjs
          node --check scripts/sync-public.mjs
      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile in Chromium
        run: node tests/smoke.mjs
      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp index.html styles.css command-center.css intelligence.css decisions.css app.js command-center.js intelligence.js decisions.js data.js favicon.svg _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages deployment
        run: |
          URL="https://abudoxali.github.io/-abud-github-universe/"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$URL" -o /tmp/abud-universe-index.html &&
               grep -q "ABUD GitHub Universe" /tmp/abud-universe-index.html &&
               curl -fsSL --max-time 15 "${URL}app.js" -o /tmp/abud-universe-app.js &&
               grep -q "ABUD GitHub Universe" /tmp/abud-universe-app.js &&
               curl -fsSL --max-time 15 "${URL}command-center.js" -o /tmp/abud-universe-command.js &&
               grep -q "Daily Command Center" /tmp/abud-universe-command.js &&
               curl -fsSL --max-time 15 "${URL}intelligence.js" -o /tmp/abud-universe-intelligence.js &&
               grep -q "public source evidence" /tmp/abud-universe-intelligence.js &&
               curl -fsSL --max-time 15 "${URL}decisions.js" -o /tmp/abud-universe-decisions.js &&
               grep -q "ABUD Universe V1.3" /tmp/abud-universe-decisions.js; then
              echo "PASS live HTTPS: $URL"
              exit 0
            fi
            echo "Waiting for Pages propagation ($attempt/12)"
            sleep 5
          done
          echo "FAIL: public Pages HTTP verification did not pass"
          exit 1
