name: Deploy GitHub Universe to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test & publish static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify static assets and JavaScript syntax
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s data.js
          test -s favicon.svg
          node --check app.js
          node --check data.js
          node --check tests/smoke.mjs
      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile in Chromium
        run: node tests/smoke.mjs
      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js favicon.svg _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
